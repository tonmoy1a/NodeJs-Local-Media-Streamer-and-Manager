services:
  media-manager:
    build: .
    container_name: local-media-manager
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - BASE_PATH=/media
      - PORT=3000
    volumes:
      # Host media folder (set BASE_PATH in .env to the folder you want to serve)
      - ${BASE_PATH}:/media
      # Persist generated thumbnails and deleted files across container restarts
      - ./cache:/app/cache
      - ./trash:/app/trash
    restart: unless-stopped
